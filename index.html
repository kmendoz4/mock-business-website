<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Flora & Fauna</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/62e8cceed4.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Navbar Section -->
    <nav class="navbar"> <!-- Navigation Bar -->
        <div class="navbar__container">
            <!-- Logo Section -->
             <a href="/" id="navbar__logo">
                <i class="fa-brands fa-pagelines"></i> Flora & Fauna</a>
             <div class="navbar__toggle" id="mobile-menu"> <!--.navbar__toggle#mobilemenu this creates div and id at same time-->
                <span class="bar"></span> <!-- shift option down arrow -->
                <span class="bar"></span>
                <span class="bar"></span>
             </div>
             <ul class="navbar__menu"> <!-- ul = unordered list ul.navbar__menu-->
                <li class="navbar__item"> <!-- li = list item li.navbar__item -->
                    <a href="/" class="navbar__links">Home</a>
                </li>
                <li class="navbar__item"> <!-- li = list item li.navbar__item -->
                    <a href="/shop.html" class="navbar__links">Shop</a>
                </li>
                <li class="navbar__btn"> <!-- li = list item li.navbar__item -->
                    <a href="/" class="button">Sign Up</a>
                </li>
             </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="main">
        <div class="main__container">
            <div class="main__content">
                <h1>Flora & Fauna</h1> <!-- Main heading for the hero section -->
                <h2>Clothing</h2>
                <p>See what makes us different</p>
                <button class="main__btn"><a href="/">Get Started</a></button>
            </div>
            <div class="main__img--container">
                <img src="images/SilliesPic1.jpg" alt="Sillies frolicking in field" id="main__img">
            </div>
        </div>
    </div>

    <script src = "app.js"></script>
</body>
</html>
